
<!doctype html>
<html lang="ar" manifest="cache.appcache">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />

    <title>Manou Gaming</title>

    <style>
      :root {
        --bg: #0b0d10;
        --panel: rgba(14, 17, 22, 0.65);
        --sunk: rgba(17, 21, 27, 0.65);
        --line: #1e2732;
        --fg: #c8ced8;
        --bright: #e6ebf2;
        --dim: #7c8798;
        --faint: #4d5765;
        --ok: #7fd0a0;
        --bad: #d08a7f;
        --warn: #d8c07f;
        --sans: "Segoe UI", system-ui, sans-serif;
        --mono: Consolas, "DejaVu Sans Mono", monospace;
      }

      * {
        box-sizing: border-box;
      }

      html,
      body {
        margin: 0;
        padding: 0;
        min-height: 100%;
        background-color: var(--bg);
        color: var(--fg);
        font: 15px/1.45 var(--sans);
      }

      /* Background image */
      body {
        background-image: url("background.jpg");
        background-position: center center;
        background-size: cover;
        background-repeat: no-repeat;
        background-attachment: fixed;
      }

      /* Brand */
      #brand {
        padding: 8px 10px;
        border-bottom: 1px solid var(--line);
        background: rgba(14, 17, 22, 0.65);
        text-align: center;
        backdrop-filter: blur(4px);
      }

      #brand b {
        color: var(--bright);
        font-size: 15px;
        font-weight: 700;
        letter-spacing: 0.14em;
      }

      /* RAM Box */
      #ramBox {
        overflow: hidden;
        padding: 5px 10px;
        border-bottom: 1px solid var(--line);
        background: rgba(17, 21, 27, 0.65);
        color: var(--ok);
        font: 11px/1.4 var(--mono);
        text-overflow: ellipsis;
        white-space: nowrap;
        backdrop-filter: blur(4px);
      }

      /* Loading Spinner */
      #spin {
        position: fixed;
        top: calc(50% + 20px);
        left: 50%;
        width: 46px;
        height: 46px;
        margin: -23px 0 0 -23px;
        border: 4px solid var(--line);
        border-top-color: var(--ok);
        border-radius: 50%;
        animation: spin 0.9s linear infinite;
      }

      @keyframes spin {
        to {
          transform: rotate(360deg);
        }
      }

      /* Message */
      #msg {
        position: fixed;
        top: 50%;
        left: 0;
        right: 0;
        transform: translateY(-50%);
        display: none;
        text-align: center;
        font-size: 16px;
        letter-spacing: 0.5px;
      }

      #state,
      #out {
        display: none;
      }

      body.done #spin,
      body.fail #spin {
        display: none;
      }

      body.fail #msg {
        display: block;
      }

      body.done #msg {
        display: block;
        color: var(--ok);
        font-weight: 700;
        letter-spacing: 2px;
      }

      /* Log Page */
      body.log {
        display: flex;
        flex-direction: column;
        height: 100vh;
      }

      body.log #spin,
      body.log #msg {
        display: none;
      }

      body.log #wrap {
        display: flex;
        flex-direction: column;
        flex: 1;
        min-height: 0;
        padding: 14px 18px 30px;
        background: transparent;
      }

      body.log #state {
        display: block;
        margin: 0 0 8px;
        font-size: 22px;
        font-weight: 700;
      }

      body.log #out {
        display: block;
        flex: 1;
        min-height: 0;
        overflow-y: auto;
        padding: 10px 12px;
        border: 1px solid var(--line);
        border-radius: 5px;
        background: rgba(17, 21, 27, 0.65);
        font: 12px/1.45 var(--mono);
        white-space: pre-wrap;
        backdrop-filter: blur(4px);
      }

      /* Error Notice */
      .notice {
        margin: 1em 0;
        padding: 0.7em 1em;
        border: 2px solid #e66;
        background: rgba(42, 20, 20, 0.85);
        color: #f99;
        font: 700 20px/1.4 var(--sans);
      }

      /* Footer */
      .byline {
        position: fixed;
        bottom: 9px;
        left: 11px;
        margin: 0;
        color: var(--faint);
        font: 11px/1 var(--mono);
        letter-spacing: 0.06em;
      }

      .ok {
        color: var(--ok);
      }

      .bad {
        color: var(--bad);
      }

      .warn {
        color: var(--warn);
      }

      code {
        color: #9fb3d0;
      }
    </style>
</head>

<body>

    <div id="brand">
    </div>

    <div id="ramBox">RAM: checking...</div>

    <div id="spin"></div>

    <div id="msg">أعد تشغيل جهاز الألعاب الخاص بك</div>

    <div id="wrap">
        <div id="state"></div>
        <div id="out"></div>
    </div>


    <script type="module">
        import "./jb.js";
    </script>

</body>
</html>
